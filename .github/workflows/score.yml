name: Record a score

# Runs arrive three ways:
#  - an issue opened from the game's "Post on GitHub" button (name = GitHub username)
#  - a repository_dispatch "score" event from the Cloudflare Worker in worker/
#    (name typed by the player, no GitHub account needed)
#  - a manual run with a JSON payload, for testing
# Each run is checked and added to scores.json (best per name per mode), then the
# site is republished. Issues get a reply with the rank and are closed.
on:
  issues:
    types: [opened]
  repository_dispatch:
    types: [score]
  workflow_dispatch:
    inputs:
      payload:
        description: 'Run as JSON: {"name","mode","time_ms","stars","total_stars","falls"}'
        required: true

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: scores
  cancel-in-progress: false

jobs:
  record:
    if: github.event_name != 'issues' || contains(github.event.issue.body, 'supertramp-score')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add the run to scores.json
        id: add
        env:
          EVENT: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          DISPATCH_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          MANUAL_PAYLOAD: ${{ github.event.inputs.payload }}
        run: python3 .github/scripts/record_score.py
      - name: Save scores.json
        if: steps.add.outputs.ok == 'true' && steps.add.outputs.changed == 'true'
        env:
          WHO: ${{ steps.add.outputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scores.json
          git commit -m "Record a score for $WHO"
          for i in 1 2 3; do git push origin HEAD:main && break; git pull --rebase origin main; done
      - name: Republish the site
        if: steps.add.outputs.ok == 'true' && steps.add.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
      - name: Reply and close the issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ steps.add.outputs.message }}
          OK: ${{ steps.add.outputs.ok }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$MESSAGE"
          if [ "$OK" = "true" ]; then reason=completed; else reason="not planned"; fi
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason "$reason"
      - name: Report
        env:
          MESSAGE: ${{ steps.add.outputs.message }}
        run: echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
