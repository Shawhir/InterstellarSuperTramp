name: Publish to GitHub Pages

# Pages serves the gh-pages branch. On every push to main, copy the game files
# there; GitHub then rebuilds the site by itself.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the game onto gh-pages
        run: |
          mkdir /tmp/site
          cp index.html scoreboard-config.js scoreboard.js audio.js game.js style.css manifest.webmanifest icon.svg icon-*.png /tmp/site/
          touch /tmp/site/.nojekyll
          git fetch origin gh-pages
          git switch gh-pages
          git rm -rq --ignore-unmatch .
          cp -r /tmp/site/. .
          git add -A
          if git diff --cached --quiet; then echo "Nothing to publish"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Publish ${GITHUB_SHA::7} from main"
          git push origin gh-pages
