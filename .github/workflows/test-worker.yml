name: Test the score middleman (temporary)
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: curl -sS -i https://supertrampscores.mkmquinn.workers.dev | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Post a test run the way the game does
        run: |
          curl -sS -i -X POST https://supertrampscores.mkmquinn.workers.dev \
            -H 'Origin: https://shawhir.github.io' -H 'Content-Type: application/json' \
            -d '{"name":"Worker Test","mode":"uber","time_ms":63000,"stars":7,"total_stars":36,"falls":4}' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: A post from another website should be refused
        run: |
          curl -sS -i -X POST https://supertrampscores.mkmquinn.workers.dev \
            -H 'Origin: https://evil.example' -H 'Content-Type: application/json' \
            -d '{"name":"Nope","mode":"uber","time_ms":63000,"stars":7,"total_stars":36}' | tee -a "$GITHUB_STEP_SUMMARY"
